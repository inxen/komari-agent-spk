name: Build Komari Agent SPK

# Manual build only. Upstream komari-agent releases are infrequent/stable,
# so there is no scheduled polling - trigger a build explicitly when a new
# upstream version is desired.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream komari-agent version, e.g. 1.5.11, or "latest" for the newest release. A leading "v" / trailing "-<rev>" is tolerated. Empty = use VERSION file.'
        required: false
        default: ''
      archs:
        description: 'Space separated arch families (x86_64 armv7 armv8)'
        required: false
        default: 'x86_64 armv7 armv8'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCHS: ${{ github.event.inputs.archs || 'x86_64 armv7 armv8' }}
      DISPATCH_VERSION: ${{ github.event.inputs.version }}
      IS_PUSH_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # VERSION file format is "<upstream>-<revision>", e.g. 1.2.60-1.
          # A bare "<upstream>" is also accepted (revision then defaults to 1).
          CUR="$(head -n1 VERSION | tr -d '[:space:]')"
          if [[ "$CUR" == *-* ]]; then
            UP="${CUR%%-*}"
            CUR_REV="${CUR##*-}"
          else
            UP="$CUR"
            CUR_REV="1"
          fi
          [[ -n "$CUR_REV" ]] || CUR_REV="1"

          # Resolve the upstream tag (TARGET) and, when the caller stated one,
          # the SPK revision (REV_EXPLICIT).
          REV_EXPLICIT=""
          RAW="$(printf '%s' "${DISPATCH_VERSION:-}" | tr -d '[:space:]')"
          if [ -n "$RAW" ]; then
            # workflow_dispatch: the input is an upstream version. Tolerate the
            # shapes people actually paste - "v1.5.11" and "1.5.11-2" - instead
            # of turning them into a 404 on the release asset URL.
            RAW="${RAW#v}"
            RAW="${RAW#V}"
            # "latest" -> newest upstream x.y.z we can package (see
            # tools/latest-version.sh). Costs reproducibility, so only when
            # explicitly asked for; pin a version for a reproducible release.
            if [ "$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')" = "latest" ]; then
              RAW="$(./tools/latest-version.sh)"
              echo "resolved 'latest' -> ${RAW}"
            fi
            TARGET="${RAW%%-*}"
            if [[ "$RAW" == *-* ]]; then
              REV_EXPLICIT="${RAW#*-}"
            fi
          elif [ "${IS_PUSH_TAG:-false}" = "true" ]; then
            # push tag v<SPK_VERSION> (e.g. v1.2.60-1): use it verbatim.
            TAG="${GITHUB_REF_NAME:-}"
            TAG="${TAG#v}"
            TARGET="${TAG%%-*}"
            if [[ "$TAG" == *-* ]]; then
              REV_EXPLICIT="${TAG#*-}"
            fi
          else
            # No input: build whatever VERSION currently tracks.
            TARGET="$UP"
          fi

          # Revision: an explicit one always wins. Otherwise keep the current
          # revision only when rebuilding the same upstream version (packaging
          # fix); when the upstream version changes, restart at 1.
          if [ -n "$REV_EXPLICIT" ]; then
            REV="$REV_EXPLICIT"
          elif [ "$TARGET" = "$UP" ]; then
            REV="$CUR_REV"
          else
            REV="1"
          fi

          SPK="${TARGET}-${REV}"

          # Fail here, with an actionable message, rather than a bare curl 404
          # in the download step a second later.
          if [[ ! "$TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot resolve a valid upstream version from '${DISPATCH_VERSION:-}' (got '$TARGET'). Use e.g. 1.5.11 or latest."
            exit 1
          fi
          if [[ ! "$SPK" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Resolved SPK version '$SPK' is not of the form <x.y.z>-<rev>."
            exit 1
          fi

          echo "target upstream=$TARGET spk_version=$SPK (from '${DISPATCH_VERSION:-<VERSION file>}')"
          echo "version=$TARGET" >> "$GITHUB_OUTPUT"
          echo "spk_version=$SPK" >> "$GITHUB_OUTPUT"

      - name: Update VERSION
        run: |
          printf '%s\n' "${{ steps.version.outputs.spk_version }}" > VERSION
          echo "VERSION -> $(cat VERSION)"

      - name: Verify upstream release
        run: make check-release
        env:
          GH_TOKEN: ${{ github.token }}

      # tee into /tmp/build.log as well, so that a download failure still lands
      # in the failure diagnostics below (previously only the Toolkit build
      # step wrote that file, so early failures published nothing at all).
      - name: Download agent binaries
        run: make download 2>&1 | tee /tmp/build.log
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache Synology toolkit tarballs
        uses: actions/cache@v4
        with:
          path: /opt/toolkit/toolkit_tarballs
          key: toolkit-tarballs-dsm74

      - name: Build SPKs natively (Synology Toolkit)
        run: |
          df -h / | tail -1
          # Native (no Docker) build: clone pkgscripts-ng once, then build each
          # arch chroot in turn and clean it up afterwards to stay within the
          # runner's disk budget (~14GB; one chroot is ~6-7GB).
          if [ ! -d /opt/toolkit/pkgscripts-ng ]; then
            sudo mkdir -p /opt/toolkit
            sudo git clone --depth 1 -b DSM7.4 \
              https://github.com/SynologyOpenSource/pkgscripts-ng.git /opt/toolkit/pkgscripts-ng
          fi
          if ! sudo TOOLKIT_DIR=/opt/toolkit bash tools/build_spk_native.sh ${ARCHS} > /tmp/build.log 2>&1; then
            echo "===== BUILD FAILED. Last 120 lines: ====="
            tail -120 /tmp/build.log
            exit 1
          fi
          echo "===== BUILD OK ====="
          tail -20 /tmp/build.log
          df -h / | tail -1
          # Restore ownership of artifacts to the runner user for later steps.
          sudo chown -R "$USER:$USER" dist/

      # Diagnostics only: this step must never be the reason a run is red, and
      # it must cope with failures that happened before the build step (when
      # /tmp/build.log does not exist).
      - name: Expose build log on failure
        if: failure()
        continue-on-error: true
        run: |
          LOG=/tmp/build.log
          {
            echo "### Build failure diagnostics"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| upstream version | \`${{ steps.version.outputs.version }}\` |"
            echo "| spk version | \`${{ steps.version.outputs.spk_version }}\` |"
            echo "| requested archs | \`${ARCHS}\` |"
            echo ""
            if [ -f "$LOG" ]; then
              echo "#### Log tail (last 200 lines)"
              echo '```'
              tail -200 "$LOG"
              echo '```'
            else
              echo "_No builder log was produced: the failure happened before the Toolkit build step._"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

          if [ ! -f "$LOG" ]; then
            echo "No builder log to publish; see the step summary above."
            exit 0
          fi

          cp "$LOG" build-failure.log
          git config user.name "Komari 社区"
          git config user.email "inxen@users.noreply.github.com"
          git add -f build-failure.log
          git commit -m "ci: build failure log"
          git push origin HEAD:refs/ci/build-log --force

      - name: Run static checks
        run: bash tests/check_static.sh dist

      - name: Compute SHA256 checksums
        run: |
          (cd dist && sha256sum *.spk) | tee /tmp/spk.sha256

      # Publish the bumped VERSION first, so the release tag (created below)
      # points at the commit that records it.
      - name: Commit VERSION bump
        run: |
          if git diff --quiet VERSION; then
            echo "VERSION unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "Komari 社区"
          git config user.email "inxen@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: track upstream komari-agent v${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      # A push-tag run already has `v<spk_version>` on the remote. A
      # workflow_dispatch build of a *new* version (e.g. `version: latest`)
      # does not, and `gh release create --verify-tag` aborts when the tag is
      # missing - so create it here, at the commit we just built.
      - name: Ensure release tag
        run: |
          TAG="v${{ steps.version.outputs.spk_version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on the remote; leaving it untouched."
            exit 0
          fi
          echo "Tag $TAG is missing; creating it at $(git rev-parse --short HEAD)."
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.spk_version }}"
          TAG="v${VERSION}"
          UPSTREAM="${{ steps.version.outputs.version }}"

          NOTES=$(cat <<EOF
          Komari Agent **${VERSION}** for Synology DSM 7.x

          Upstream komari-agent: [${UPSTREAM}](https://github.com/komari-monitor/komari-agent/releases/tag/${UPSTREAM})

          ## 架构 / Architecture
          - \`KomariAgent-x86_64-${VERSION}.spk\` (Intel/AMD)
          - \`KomariAgent-armv8-${VERSION}.spk\` (ARM 64-bit)
          - \`KomariAgent-armv7-${VERSION}.spk\` (ARM 32-bit)

          ## SHA256
          $(sed 's/^/    /' /tmp/spk.sha256)

          ## 安装
          在 DSM 套件中心点击"手动安装"，选择对应架构的 .spk 文件即可。
          EOF
          )

          # Idempotent: if a release for this tag already exists, delete it (keep the
          # tag) and recreate so the assets and notes reflect this build.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; deleting and recreating."
            gh release delete "$TAG" --yes
          fi
          # The tag is guaranteed to exist by the "Ensure release tag" step
          # above, which is exactly what --verify-tag checks. Do NOT use
          # --cleanup-tag on delete, which would remove the tag and break this
          # step.
          gh release create "$TAG" dist/*.spk \
            --title "Komari Agent ${VERSION}" \
            --notes "$NOTES" \
            --verify-tag 2>&1
          echo "===== verification ====="
          gh release view "$TAG" --json name,tagName,assets -q '.name+" / "+.tagName+" / assets="+(.assets|length|tostring)'

      - name: Upload SPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-spk
          path: dist/*.spk
          if-no-files-found: error
